<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Test</title>
</head>
<body>
    <header>
        <h1>The Main Title</h1>
        <!-- there are different levels of headers, h1 through h6-->
        <h2>This is a sub header</h2>

    </main>
    <footer>
        <p>&copy; 2026</p>
    </footer>

</html>
